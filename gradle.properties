org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
kotlin.mpp.enableCInteropCommonization=true
# iOS targets cannot be built on Windows; suppress the resulting warning.
kotlin.native.ignoreDisabledTargets=true

# The user-level GRADLE_USER_HOME\gradle.properties (D:\.gradle) points HTTPS
# traffic at a local proxy (localhost:7890) that is not always running.
# Override at project level so builds do not depend on it.
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=
